name: Bug report
description: Something in the template or a generated project does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Found a way around a guardrail, or a check that passes when it should fail?** That is a
        security issue: please report it privately from the Security tab instead (see SECURITY.md).

        Never paste real secrets, credentials or client names here. Use obviously fake values.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and the output you got.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Template version
      description: The commit you are on (`git rev-parse --short HEAD`), or the date you bootstrapped.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - During /bootstrap
        - AI command guard (block / ask / allow)
        - A guardrail check
        - Secret scanning (gitleaks)
        - Local hooks or CI
        - Governance records
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, Node version, Claude Code version.
