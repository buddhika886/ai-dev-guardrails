# CI (Layer 4) is the authority. Re-runs everything on a clean checkout so nothing merges on a
# "works on my machine". /bootstrap copies this to .github/workflows/ci.yml.
#
# Parity with local: the `verify` job runs the same commands as the Lefthook pre-push hook
# (typecheck, build, guardrails) plus lint, the `dependencies` job runs the same OSV-Scanner scan as
# pre-push, and the `secrets` job runs the same gitleaks scan as the pre-commit hook but over full
# history. If you change a check here, change it in lefthook.yml too.
#
# Enable branch protection on main: require all three jobs to pass and at least one review; disallow
# force-push.
#
# Actions are pinned to full commit SHAs (with the release as a comment), so a moved or hijacked tag
# cannot change what runs. .github/dependabot.yml proposes updates to the pins.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the additive-migration guardrail can diff vs the base ref
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Registry signatures (tampered or unsigned packages)
        # npm audit signatures errors when there is nothing installed to check, so a project with no
        # dependencies yet says so instead.
        run: |
          if node -e 'process.exit(Object.keys(require("./package-lock.json").packages || {}).length > 1 ? 0 : 1)'; then
            npm audit signatures
          else
            echo "SKIPPED (no dependencies to verify yet)"
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Guardrails (repo security rules + schema truth)
        env:
          GUARDRAILS_BASE: origin/${{ github.base_ref || 'main' }}
          # Client identifiers that must never be committed, one regex per line. Set it as a
          # repository secret so the list itself is never committed; check [9] reports SKIPPED
          # while it is unset. GitHub masks secret values in logs, and the check prints only
          # path:line, never the match.
          GUARDRAILS_DENYLIST: ${{ secrets.GUARDRAILS_DENYLIST }}
        # A pull request is judged by the BASE branch's copy of the checks, so a change that weakens
        # a check cannot grade itself; the new checks take over once the change is reviewed and
        # merged. A push to main (no base) runs the committed copy. The workflow file itself can
        # still be changed by a pull request, which is why CODEOWNERS covers .github/ and the
        # ruleset requires an owner's review.
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git show "origin/${GITHUB_BASE_REF}:scripts/ci-guardrails.sh" > "${RUNNER_TEMP}/ci-guardrails.sh" \
              || { echo "could not read scripts/ci-guardrails.sh from origin/${GITHUB_BASE_REF} (failing closed)"; exit 1; }
            echo "Running the guardrails from origin/${GITHUB_BASE_REF}"
            bash "${RUNNER_TEMP}/ci-guardrails.sh"
          else
            bash scripts/ci-guardrails.sh
          fi

  dependencies:
    # Known vulnerabilities in package-lock.json, from the OSV database (GitHub, npm and other
    # advisory sources). Any finding fails the job. To accept one for a while, list it in
    # osv-scanner.toml with an ignoreUntil date and a reason, in a reviewed pull request: the
    # exception expires on that date and the job goes red again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OSV-Scanner (checksum pinned in this file)
        env:
          # ---- Pinned release. To bump: pick a new version, copy the sha256 for
          # osv-scanner_linux_amd64 from that release's osv-scanner_SHA256SUMS into SHA256 below,
          # and update VERSION. As with gitleaks, the checksum is pinned here, never fetched at
          # build time. ----
          VERSION: "2.7.0"
          SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
        run: |
          set -euo pipefail
          BIN="osv-scanner_linux_amd64"
          curl -sSLo "$BIN" "https://github.com/google/osv-scanner/releases/download/v${VERSION}/${BIN}"
          echo "${SHA256}  ${BIN}" | sha256sum -c -
          sudo install "$BIN" /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: Scan dependencies for known vulnerabilities
        # A missing lockfile is an error (exit 127), not a pass. OSV-Scanner also exits non-zero on a
        # lockfile with no packages, so a project with no dependencies yet says so instead.
        run: |
          if node -e 'process.exit(Object.keys(require("./package-lock.json").packages || {}).length > 1 ? 0 : 1)' 2>/dev/null; then
            osv-scanner scan source --lockfile package-lock.json
          elif [ -f package-lock.json ]; then
            echo "SKIPPED (no dependencies to scan yet)"
          else
            echo "package-lock.json is missing"; exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum pinned in this file)
        env:
          # ---- Pinned release. To bump: pick a new version, download that release's
          # gitleaks_<VERSION>_checksums.txt, copy the sha256 for the linux_x64 tarball into SHA256
          # below, and update VERSION. We pin the checksum LITERAL here rather than downloading and
          # trusting the release's checksums.txt at build time, so a tampered or swapped release
          # asset cannot pass: the binary must match the hash we reviewed when we bumped. ----
          VERSION: "8.21.2"
          SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${TARBALL}"
          curl -sSLo "$TARBALL" "$URL"
          echo "${SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan for secrets (full history)
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
